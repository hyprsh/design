# Builds the docs site and deploys it to GitHub Pages (https://hyprsh.github.io/design/) on a version tag or by hand.
# Every check runs first; any failure stops the deploy. A tag that deploys also gets a GitHub release, with notes from the commits since the previous tag.
name: Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/build.mjs --check
      - run: npm run build
      - run: node scripts/smoke.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/site.mjs
      - run: node scripts/examples.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .cache/site
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
