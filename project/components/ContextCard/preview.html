<!-- @dsCard group="Overlays" height=280 subtitle="Hover or focus card: sides, alignment, entity metadata, link trigger" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ContextCard</title></head>
<body>
<div id="root" style="display:flex;justify-content:space-around;align-items:flex-start;padding:40px 24px 0;gap:24px"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
function Row(k, v) {
  return h('div', { key: k, style: { display: 'flex', justifyContent: 'space-between', gap: 24 } },
    h('span', { style: { color: 'var(--gray-900)' } }, k), h('span', null, v));
}
function Project() {
  return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12, minWidth: 240 } },
    h('div', { style: { display: 'flex', gap: 12, alignItems: 'center' } },
      h('span', { 'aria-hidden': 'true', style: { width: 32, height: 32, borderRadius: 'var(--radius-full)', background: 'var(--gray-200)', display: 'grid', placeItems: 'center', fontSize: 12, fontWeight: 500 } }, 'HW'),
      h('div', null, h('div', { className: 'label-14', style: { fontWeight: 600 } }, 'hyprsh-web'), h('div', { className: 'label-13', style: { color: 'var(--gray-900)' } }, 'hyprsh-web.dev'))),
    h('div', { className: 'label-13', style: { display: 'flex', flexDirection: 'column', gap: 6 } },
      Row('Framework', 'Next.js'), Row('Last Deploy', '2h ago'), Row('Plan', 'Pro')));
}
function Demo() {
  return h(F, null,
    h(H.ContextCard, { content: h(Project), side: 'bottom', align: 'start', defaultOpen: true }, h(H.Button, { size: 'small' }, 'hyprsh-web')),
    h(H.ContextCardTrigger, { content: 'Built from main in 42s, promoted to production', side: 'bottom', align: 'end', defaultOpen: true,
      render: h('a', { href: '#deployment', style: { color: 'var(--link)', textUnderlineOffset: 2 } }) }, 'dpl_4f2a9c1'));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
