<!-- @dsCard group="Forms" height=480 subtitle="Settings card rows: an input, a select and a switch, one changed" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SettingRow</title></head>
<body>
<div id="root" class="hy-col" style="max-width:none"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
function Demo() {
  var s = React.useState('docs-site'), name = s[0], setName = s[1];
  return h(H.Fieldset, null,
    h(H.FieldsetContent, null,
      h(H.FieldsetTitle, null, 'General'),
      h(H.FieldsetSubtitle, null, 'How this project appears and deploys.'),
      h(H.SettingRow, { label: 'Project Name', help: 'Shown on the dashboard and in the CLI.', changed: name !== 'docs-site' },
        h(H.Input, { name: 'name', autoComplete: 'off', spellCheck: false, value: name, onChange: function (e) { setName(e.target.value); } })),
      h(H.SettingRow, { label: 'Region', help: 'Where builds and functions run.', changed: true },
        h(H.Select, { name: 'region', defaultValue: 'iad1', options: [{ value: 'iad1', label: 'Washington, D.C.' }, { value: 'sfo1', label: 'San Francisco' }] })),
      h(H.SettingRow, { label: 'Preview Deployments', help: 'Deploy every branch.' },
        h(H.Switch, { defaultValue: 'on' },
          h(H.SwitchControl, { label: 'On', value: 'on' }),
          h(H.SwitchControl, { label: 'Off', value: 'off' })))),
    h(H.FieldsetFooter, null,
      h(H.FieldsetFooterStatus, null, 'One setting changed.'),
      h(H.FieldsetFooterActions, null, h(H.FieldsetFooterAction, null, 'Save'))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
