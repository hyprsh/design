<!-- @dsCard group="Forms" height=100 subtitle="System, light and dark theme radios" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ThemeSwitcher</title></head>
<body>
<div id="root" class="hy-row" style="gap:32px"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
function Demo() {
  return h(F, null,
    h(H.ThemeSwitcher, { storageKey: null }),
    h(H.ThemeSwitcher, { storageKey: null, size: 'small' }),
    h(H.ThemeSwitcher, { storageKey: null, defaultValue: 'dark', disabled: true }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
