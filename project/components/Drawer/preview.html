<!-- @dsCard group="Overlays" height=340 subtitle="Bottom sheet: backdrop, swipe or tap outside to dismiss" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Drawer</title></head>
<body>
<div id="root" class="hy-row"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
function Demo() {
  var s = React.useState(true), open = s[0], setOpen = s[1];
  function close() { setOpen(false); }
  return h(F, null,
    h(H.Button, { onClick: function () { setOpen(true); } }, 'Filter Logs'),
    h(H.Drawer, { show: open, onDismiss: close, inline: true },
      h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16, padding: 24 } },
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: 4, textAlign: 'center' } },
          h(H.DrawerTitle, null, 'Filter Logs'),
          h('p', { className: 'copy-14', style: { margin: 0, color: 'var(--gray-900)' } }, 'Show requests from the last 24 hours that match a path.')),
        h(H.Input, { label: 'Path', name: 'path', autoComplete: 'off', spellCheck: false, placeholder: '/api/deployments…' }),
        h('div', { style: { display: 'flex', gap: 8 } },
          h(H.Button, { style: { flex: 1 }, onClick: close }, 'Cancel'),
          h(H.Button, { style: { flex: 1 }, variant: 'primary', onClick: close }, 'Apply Filter')))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
