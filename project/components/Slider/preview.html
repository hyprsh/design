<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Slider</title></head>
<body>
<div id="root" class="hy-col"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
function Demo() {
  var cpu = React.useState([50]);
  var mem = React.useState([256, 1024]);
  return h(F, null,
    h(H.Slider, { label: 'CPU Share', value: cpu[0], onValueChange: cpu[1], showEndInput: true, formatValue: function (v) { return v + '%'; } }),
    h(H.Slider, { label: 'Memory (MB)', min: 128, max: 2048, step: 128, value: mem[0], onValueChange: mem[1], showStartInput: true, showEndInput: true }),
    h(H.Slider, { label: 'Disabled', defaultValue: 30, disabled: true, showEndInput: true }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
