<!-- @dsCard group="Feedback" height=268 subtitle="Default, success, warning, error, secondary; colour thresholds; stops; label" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Progress</title></head>
<body>
<div id="root" class="hy-col"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
function Demo() {
  var v = React.useState(30), value = v[0], set = v[1];
  var colors = { 0: 'var(--gray-1000)', 60: 'var(--amber-700)', 85: 'var(--red-700)' };
  return h(F, null,
    h(H.Progress, { value: 42, 'aria-label': 'Upload' }),
    h(H.Progress, { value: 64, type: 'success', 'aria-label': 'Build' }),
    h(H.Progress, { value: 78, type: 'warning', 'aria-label': 'Bandwidth' }),
    h(H.Progress, { value: 96, type: 'error', 'aria-label': 'Function Invocations' }),
    h(H.Progress, { value: 50, type: 'secondary', 'aria-label': 'Storage' }),
    h(H.Progress, { label: 'Build Minutes', value: 72, stops: [{ value: 25, tooltip: 'Hobby limit' }, { value: 75, tooltip: 'Pro limit' }] }),
    h('div', { className: 'hy-row', style: { padding: 0, gap: 12 } },
      h(H.Progress, { value: value, colors: colors, 'aria-label': 'Usage', style: { flex: 1 } }),
      h(H.Button, { size: 'small', onClick: function () { set(value >= 100 ? 10 : value + 15); } }, 'Increase')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
