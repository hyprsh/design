<!-- @dsCard group="Forms" height=240 subtitle="Esc key once dirty, Escape clears, ⌘K hint, disabled" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ClearableInput</title></head>
<body>
<div id="root" class="hy-col"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
function Demo() {
  var s = React.useState('production'), value = s[0], setValue = s[1];
  return h(F, null,
    h(H.ClearableInput, { label: 'Environment', name: 'env', autoComplete: 'off', spellCheck: false, placeholder: 'preview', value: value, onChange: function (e) { setValue(e.target.value); } }),
    h(H.ClearableInput, { 'aria-label': 'Filter Domains', autoComplete: 'off', spellCheck: false, placeholder: 'Filter domains…', cmdk: true }),
    h(H.ClearableInput, { 'aria-label': 'Filter Projects', placeholder: 'Filter projects…', defaultValue: 'acme', disabled: true }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
