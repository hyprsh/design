<!-- @dsCard group="Status" height=290 subtitle="Semantic and info states, outline and dashed variants, a grouped row of dots" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>StatusDot</title></head>
<body>
<div id="root" class="hy-col" style="max-width:none"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
function Demo() {
  var states = ['QUEUED', 'BUILDING', 'READY', 'ERROR', 'CANCELED', 'DELETED'];
  var sem = ['success', 'warning', 'error', 'neutral', 'pending', 'info'];
  var variants = ['filled', 'outline', 'dashed'];
  return h(F, null,
    h('div', { className: 'hy-row', style: { padding: 0, gap: 24 } }, sem.map(function (s) { return h(H.StatusDot, { key: s, state: s }); })),
    h('div', { className: 'hy-row', style: { padding: 0, gap: 24 } },
      h(H.StatusDot, { state: 'success', label: 'Healthy' }), h(H.StatusDot, { state: 'warning', label: 'Degraded' }),
      h(H.StatusDot, { state: 'error', label: 'Failing' }), h(H.StatusDot, { state: 'neutral', label: 'Idle' }),
      sem.map(function (s) { return h(H.StatusDot, { key: s, state: s, label: false, titlePrefix: 'Indexer' }); })),
    h('div', { className: 'hy-row', style: { padding: 0, gap: 24 } }, states.map(function (s) { return h(H.StatusDot, { key: s, state: s }); })),
    h('div', { className: 'hy-row', style: { padding: 0, gap: 24 } }, states.map(function (s) { return h(H.StatusDot, { key: s, state: s, label: false, titlePrefix: 'api-gateway production' }); })),
    variants.map(function (v) {
      return h('div', { key: v, className: 'hy-row', style: { padding: 0, gap: 24 } }, ['info', 'success', 'warning', 'error', 'pending'].map(function (s) { return h(H.StatusDot, { key: s, state: s, variant: v }); }));
    }),
    h('span', { role: 'img', 'aria-label': '4K: wanted, 1080p: on disk, 720p: downloading', className: 'hy-row', style: { padding: 0, gap: 8 } },
      h(H.StatusDot, { state: 'info', variant: 'outline', label: false, 'aria-hidden': true }), h('span', { 'aria-hidden': 'true', style: { fontSize: 14, marginRight: 12 } }, '4K'),
      h(H.StatusDot, { state: 'success', label: false, 'aria-hidden': true }), h('span', { 'aria-hidden': 'true', style: { fontSize: 14, marginRight: 12 } }, '1080p'),
      h(H.StatusDot, { state: 'pending', variant: 'dashed', label: false, 'aria-hidden': true }), h('span', { 'aria-hidden': 'true', style: { fontSize: 14 } }, '720p')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
