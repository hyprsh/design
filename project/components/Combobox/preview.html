<!-- @dsCard group="Forms" height=380 subtitle="Filter as you type, clearable, sizes" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Combobox</title></head>
<body>
<div id="root" class="hy-row" style="max-width:none;align-items:flex-start"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
var runtimes = ['Node.js 22', 'Node.js 20', 'Bun 1.2', 'Deno 2', 'Python 3.13', 'Go 1.23', 'Ruby 3.3'];
function Demo() {
  var v = React.useState('bun');
  return h(F, null,
    h(H.Combobox, { 'aria-label': 'Runtime', placeholder: 'Search runtimes…', width: 256, value: v[0], onChange: v[1], clearable: true, defaultOpen: true },
      h(H.ComboboxInput, null),
      h(H.ComboboxList, { emptyMessage: function (q) { return 'No runtimes match “' + q + '”'; } },
        runtimes.map(function (r) { return h(H.ComboboxOption, { key: r, value: r.split(' ')[0].toLowerCase() + (r === 'Node.js 20' ? '-20' : '') }, r); }))),
    h('div', { className: 'hy-col', style: { padding: 0, gap: 12, width: 256 } },
      h(H.Combobox, { 'aria-label': 'Region', placeholder: 'Search regions…', size: 'small', options: ['Frankfurt', 'Washington', 'Tokyo', 'São Paulo'] }),
      h(H.Combobox, { 'aria-label': 'Team', placeholder: 'Search teams…', size: 'large', errored: true, options: ['Platform', 'Billing', 'Growth'] }),
      h(H.Combobox, { 'aria-label': 'Branch', placeholder: 'Disabled', disabled: true, options: ['main'] })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
