<!-- @dsCard group="Forms" height=600 subtitle="Range with presets, popover open" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Calendar</title></head>
<body>
<div id="root" class="hy-row" style="max-width:none;align-items:flex-start;gap:24px"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
function day(offset) { var d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + offset); return d; }
var presets = {
  last7: { text: 'Last 7 Days', start: day(-6), end: day(0) },
  last30: { text: 'Last 30 Days', start: day(-29), end: day(0) },
  last90: { text: 'Last 90 Days', start: day(-89), end: day(0) }
};
function Demo() {
  var range = React.useState({ start: day(-8), end: day(-2) });
  return h(F, null,
    h('div', { className: 'hy-col', style: { padding: 0, gap: 12, width: 340 } },
      h(H.Calendar, { presets: presets, size: 'small', showTimeInput: false, maxValue: day(0) }),
      h(H.Calendar, { presets: presets, compact: true, size: 'small', maxValue: day(0) }),
      h(H.Calendar, { mode: 'single', size: 'small', allowClear: true, defaultValue: day(3) })),
    h(H.Calendar, { value: range[0], onChange: range[1], allowClear: true, defaultOpen: true, maxValue: day(0), 'aria-label': 'Date range' }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
