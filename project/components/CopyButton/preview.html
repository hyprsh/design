<!-- @dsCard group="Actions" height=160 subtitle="Icon button that copies text and crossfades to a check" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CopyButton</title></head>
<body>
<div id="root" class="hy-col"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
function Row(label, btn) {
  return h('div', { className: 'hy-row', style: { padding: 0, gap: 8 } },
    h('code', { className: 'hy-mono', style: { color: 'var(--gray-1000)' } }, label), btn);
}
function Demo() {
  return h(F, null,
    Row('acme-web-git-main.hypr.app', h(H.CopyButton, { textToCopy: 'https://acme-web-git-main.hypr.app', label: 'Copy Deployment URL' })),
    Row('npm install @acme/ui', h(H.CopyButton, { textToCopy: 'npm install @acme/ui', label: 'Copy Install Command', variant: 'tertiary', size: 'small' })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
