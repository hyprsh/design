<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Browser</title></head>
<body>
<div id="root" class="hy-col" style="max-width:none"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
function Bar(p) { return h('div', { style: { height: p.h || 12, width: p.w, borderRadius: 4, background: p.c || 'var(--gray-200)' } }); }
function Page() {
  return h('div', { role: 'img', 'aria-label': 'Project overview with a deployment list', style: { padding: 24, display: 'grid', gridTemplateColumns: '200px 1fr', gap: 24, height: 200, boxSizing: 'border-box' } },
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } }, h(Bar, { w: '70%', h: 16, c: 'var(--gray-300)' }), h(Bar, { w: '90%' }), h(Bar, { w: '60%' }), h(Bar, { w: '80%' })),
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } },
      h(Bar, { w: '40%', h: 16, c: 'var(--gray-300)' }),
      h('div', { style: { flex: 1, borderRadius: 6, background: 'var(--background-100)', boxShadow: 'var(--shadow-border)' } })));
}
function Demo() { return h(H.Browser, { address: 'https://www.acme-docs.dev/deployments' }, h(Page)); }
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
