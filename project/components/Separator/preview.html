<!-- @dsCard group="Layout" height=350 subtitle="Horizontal, vertical, inset in a framed card" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Separator</title></head>
<body>
<div id="root" class="hy-col"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
function Section(title, text) {
  return h('div', null, h('h3', { className: 'label-16', style: { margin: 0 } }, title), h('p', { className: 'copy-14', style: { margin: '4px 0 0', color: 'var(--gray-900)' } }, text));
}
function Demo() {
  return h(F, null,
    Section('Build Settings', 'Framework, root directory and output.'),
    h(H.Separator),
    Section('Environment Variables', 'Values available at build and run time.'),
    h('div', { style: { display: 'flex', alignItems: 'center', gap: 16, height: 32 }, className: 'copy-14' },
      h('span', null, 'Overview'), h(H.Separator, { orientation: 'vertical' }), h('span', null, 'Deployments'), h(H.Separator, { orientation: 'vertical' }), h('span', null, 'Logs')),
    h('div', { style: { borderRadius: 'var(--radius-lg)', boxShadow: 'var(--shadow-border)', background: 'var(--background-100)' } },
      h('div', { className: 'label-14', style: { padding: '12px 16px' } }, 'Deployment'),
      h(H.Separator, { inset: true, 'aria-hidden': true }),
      h('div', { className: 'copy-14', style: { padding: 16, color: 'var(--gray-900)' } }, 'Ready in 42s from main.')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
