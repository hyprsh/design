<!-- @dsCard group="Media" height=260 subtitle="Levels with progress, heights, silent and out-of-range values, beside a play button" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Waveform</title></head>
<body>
<div id="root" class="hy-col"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
var levels = [0.2, 0.4, 0.7, 0.5, 0.9, 0.6, 0.3, 0.8, 1, 0.55, 0.35, 0.65, 0.45, 0.25, 0.1, 0.3, 0.5, 0.7, 0.4, 0.2, 0.6, 0.85, 0.5, 0.3];
var edge = [0, 0.5, 1.4, -0.2, 0.8, 0, 0.3, 0, 0.6, 2, 0, 0.4];
function Demo() {
  var p = React.useState(false), playing = p[0], set = p[1];
  return h(F, null,
    h('div', { className: 'hy-row', style: { padding: 0, gap: 12, flexWrap: 'nowrap' } },
      h(H.Button, { variant: 'secondary', 'aria-label': playing ? 'Pause Voice Message' : 'Play Voice Message', onClick: function () { set(!playing); } },
        h(H.Icon, { name: playing ? 'pause' : 'play' })),
      h(H.Waveform, { levels: levels, progress: 0.35 })),
    h(H.Waveform, { levels: levels }),
    h(H.Waveform, { levels: levels, progress: 1, height: 20 }),
    h(H.Waveform, { levels: edge, progress: 0.5, height: 48 }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
