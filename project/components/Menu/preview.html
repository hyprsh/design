<!-- @dsCard group="Overlays" height=440 subtitle="MenuContainer, MenuButton, sections, locked and error items, checked items, a submenu, typeahead; older label + items API" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Menu</title></head>
<body>
<div id="root" class="hy-row" style="align-items:flex-start;gap:24px"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
function noop() {}
function Checks() {
  var a = React.useState('1m'), b = React.useState({ branch: true, author: false });
  var opts = [['30s', 'Every 30 Seconds'], ['1m', 'Every Minute'], ['5m', 'Every 5 Minutes']];
  return h(H.MenuContainer, { defaultOpen: true, style: { marginRight: 110 } },
    h(H.MenuButton, null, 'Monitoring'),
    h(H.Menu, { width: 220 },
      h(H.MenuSection, { title: 'Check Interval' }, opts.map(function (o) {
        return h(H.MenuItem, { key: o[0], role: 'radio', checked: a[0] === o[0], onClick: function () { a[1](o[0]); } }, o[1]);
      })),
      h(H.MenuDivider),
      ['branch', 'author'].map(function (k) {
        return h(H.MenuItem, { key: k, checked: b[0][k], onClick: function () { var n = Object.assign({}, b[0]); n[k] = !n[k]; b[1](n); } }, k === 'branch' ? 'Show Branch' : 'Show Author');
      })));
}
function Sub() {
  return h(H.MenuContainer, { defaultOpen: true, style: { marginRight: 220 } },
    h(H.MenuButton, null, 'Project'),
    h(H.Menu, { width: 180 },
      h(H.MenuItem, { onClick: noop }, 'Rename Project'),
      h(H.MenuSub, { defaultOpen: true },
        h(H.MenuSubTrigger, { prefix: h(H.Icon, { name: 'external-link' }) }, 'Open In'),
        h(H.Menu, { width: 140 },
          h(H.MenuItem, { onClick: noop }, 'Editor'),
          h(H.MenuItem, { onClick: noop }, 'Terminal'),
          h(H.MenuItem, { onClick: noop }, 'Browser'))),
      h(H.MenuItem, { onClick: noop }, 'Duplicate Project')));
}
function Demo() {
  return h(F, null,
    h(Sub),
    h(Checks),
    h(H.MenuContainer, { defaultOpen: true },
      h(H.MenuButton, null, 'Actions'),
      h(H.Menu, { width: 220 },
        h(H.MenuSection, { title: 'Deployment' },
          h(H.MenuItem, { onClick: noop, shortcut: '⌘ R' }, 'Redeploy'),
          h(H.MenuItem, { onClick: noop }, 'Promote to Production')),
        h(H.MenuLink, { href: '#logs' }, 'View Build Logs'),
        h(H.MenuItemLocked, null, 'Transfer to Team…'),
        h(H.MenuItem, { disabled: true, description: 'No file to delete' }, 'Delete File'),
        h(H.MenuItem, { onClick: noop, description: 'Runs the build again' }, 'Rebuild'),
        h(H.MenuDivider),
        h(H.MenuItem, { onClick: noop, type: 'error' }, 'Delete Deployment…'))),
    h(H.MenuContainer, null,
      h(H.MenuButton, { variant: 'secondary', showChevron: true }, 'Project'),
      h(H.Menu, null,
        h(H.MenuItem, { prefix: h(H.Icon, { name: 'git-branch' }) }, 'Switch Branch'),
        h(H.MenuItem, { prefix: h(H.Icon, { name: 'settings' }) }, 'Open Settings'))),
    h(H.Menu, { label: 'More', items: [
      { label: 'Rename…' },
      { label: 'Duplicate Project' },
      { separator: true },
      { label: 'Delete Project…', danger: true }] }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
