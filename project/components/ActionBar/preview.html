<!-- @dsCard group="Feedback" height=1040 subtitle="Capsule at the foot of a scroll area: selection chip with clear and Select All, unsaved changes with a tone dot, the narrow form with a More menu, busy Save with an error, close button" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ActionBar</title></head>
<body>
<div id="root" class="hy-col" style="max-width:560px"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
var domains = ['hyprsh.dev', 'docs.hyprsh.dev', 'api.hyprsh.dev', 'status.hyprsh.dev', 'blog.hyprsh.dev', 'app.hyprsh.dev'];
var frame = { height: 200, overflowY: 'auto', border: '1px solid var(--gray-alpha-400)', borderRadius: 8, background: 'var(--background-100)' };
function Selection(props) {
  var s = React.useState(['docs.hyprsh.dev', 'api.hyprsh.dev']), sel = s[0], setSel = s[1];
  function toggle(n) { setSel(sel.indexOf(n) >= 0 ? sel.filter(function (x) { return x !== n; }) : sel.concat(n)); }
  return h('div', { style: Object.assign({}, frame, { maxWidth: props.width }) },
    h(H.Entity.List, { 'aria-label': 'Domains' }, domains.map(function (n) {
      return h(H.Entity, { key: n, left: h(H.Checkbox, { 'aria-label': 'Select ' + n, checked: sel.indexOf(n) >= 0, onChange: function () { toggle(n); } }) },
        h(H.Entity.Content, { title: n, fill: true }));
    })),
    h(H.ActionBar, { open: sel.length > 0, selection: { count: sel.length, total: domains.length, onSelectAll: function () { setSel(domains); }, onClear: function () { setSel([]); } },
      secondaryActions: [{ label: 'Unmonitor', onSelect: function () {} }],
      actions: h(H.Button, { size: 'small', variant: 'primary' }, 'Monitor') }));
}
function Demo() {
  return h(F, null,
    h('p', { className: 'label-13' }, 'Selection: the count chip clears, Select All ticks every row'),
    h(Selection, {}),
    h('p', { className: 'label-13' }, 'Narrow (under 480px): Select All and the secondary actions fold into More'),
    h(Selection, { width: 360 }),
    h('p', { className: 'label-13' }, 'Unsaved changes with a warning dot'),
    h('div', { style: Object.assign({}, frame, { height: 'auto', minHeight: 64 }) },
      h(H.ActionBar, { open: true, tone: 'warning', label: '2 unsaved changes',
        actions: h(F, null, h(H.Button, { size: 'small', variant: 'tertiary' }, 'Discard'), h(H.Button, { size: 'small', variant: 'primary' }, 'Save')) })),
    h('p', { className: 'label-13' }, 'Busy Save with an error'),
    h('div', { style: Object.assign({}, frame, { height: 'auto', minHeight: 88 }) },
      h(H.ActionBar, { open: true, tone: 'warning', label: '2 unsaved changes', error: 'Couldn’t save. Check your connection and try again.',
        actions: h(F, null, h(H.Button, { size: 'small', variant: 'tertiary', disabled: true }, 'Discard'), h(H.Button, { size: 'small', variant: 'primary', loading: true }, 'Save')) })),
    h('p', { className: 'label-13' }, 'Close button'),
    h('div', { style: Object.assign({}, frame, { height: 'auto', minHeight: 64 }) },
      h(H.ActionBar, { open: true, tone: 'success', label: 'Preview ready for review', onClose: function () {}, actions: h(H.Button, { size: 'small', variant: 'secondary' }, 'Open Preview') })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
