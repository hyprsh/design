<!-- @dsCard group="Feedback" height=1260 subtitle="Sticky bar at the foot of a scroll area: unsaved changes, selection with Select All and Clear, busy Save, error, close button, translucent over content and opaque" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ActionBar</title></head>
<body>
<div id="root" class="hy-col" style="max-width:420px"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
var domains = ['hyprsh.dev', 'docs.hyprsh.dev', 'api.hyprsh.dev', 'status.hyprsh.dev', 'blog.hyprsh.dev', 'app.hyprsh.dev'];
var frame = { height: 200, overflowY: 'auto', border: '1px solid var(--gray-alpha-400)', borderRadius: 8, background: 'var(--background-100)' };
/* Busy, high-contrast tiles drawn from tokens, to test the bar's surface against. */
var posters = [
  'repeating-linear-gradient(45deg, var(--gray-1000) 0 6px, var(--background-100) 6px 12px)',
  'conic-gradient(from 90deg, var(--accent-900), var(--red-800), var(--amber-700), var(--gray-1000), var(--accent-900))',
  'linear-gradient(135deg, var(--gray-1000) 0 50%, var(--background-100) 50% 100%)'
];
function Poster() {
  return h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8, padding: 12 } },
    posters.map(function (bg, i) { return h('div', { key: i, 'aria-hidden': 'true', style: { height: 120, borderRadius: 8, background: bg } }); }));
}
function Over(props) {
  var ref = React.useRef(null);
  React.useLayoutEffect(function () { ref.current.scrollTop = 40; }, []);
  return h('div', { ref: ref, tabIndex: 0, role: 'region', 'aria-label': props.name, style: frame },
    h(Poster), h(Poster),
    h(H.ActionBar, { open: true, opaque: props.opaque, label: '3 unsaved changes',
      actions: h(F, null, h(H.Button, { size: 'small', variant: 'tertiary' }, 'Discard'), h(H.Button, { size: 'small', variant: 'primary' }, 'Save')) }));
}
function Selection() {
  var s = React.useState(['docs.hyprsh.dev', 'api.hyprsh.dev']), sel = s[0], setSel = s[1];
  function toggle(n) { setSel(sel.indexOf(n) >= 0 ? sel.filter(function (x) { return x !== n; }) : sel.concat(n)); }
  return h('div', { style: frame },
    h(H.Entity.List, { 'aria-label': 'Domains' }, domains.map(function (n) {
      return h(H.Entity, { key: n, left: h(H.Checkbox, { 'aria-label': 'Select ' + n, checked: sel.indexOf(n) >= 0, onChange: function () { toggle(n); } }) },
        h(H.Entity.Content, { title: n, fill: true }));
    })),
    h(H.ActionBar, { open: sel.length > 0, selection: { count: sel.length, total: domains.length, onSelectAll: function () { setSel(domains); }, onClear: function () { setSel([]); } },
      actions: h(F, null, h(H.Button, { size: 'small', variant: 'secondary' }, 'Monitor'), h(H.Button, { size: 'small', variant: 'secondary' }, 'Unmonitor')) }));
}
function Demo() {
  return h(F, null,
    h('p', { className: 'label-13' }, 'Default: translucent over content'),
    h(Over, { name: 'Content under the bar' }),
    h('p', { className: 'label-13' }, 'opaque'),
    h(Over, { name: 'Content under the opaque bar', opaque: true }),
    h('p', { className: 'label-13' }, 'Selection: tick rows, then Select All and Clear'),
    h(Selection),
    h('p', { className: 'label-13' }, 'Busy Save with an error'),
    h('div', { style: Object.assign({}, frame, { height: 140 }) },
      h(H.ActionBar, { open: true, label: '3 unsaved changes', error: 'Couldn’t save the changes. Check your connection and try again.',
        actions: h(F, null, h(H.Button, { size: 'small', variant: 'tertiary' }, 'Discard'), h(H.Button, { size: 'small', variant: 'primary', loading: true }, 'Save')) })),
    h('p', { className: 'label-13' }, 'Close button'),
    h('div', { style: Object.assign({}, frame, { height: 100 }) },
      h(H.ActionBar, { open: true, label: 'Preview ready for review', onClose: function () {}, actions: h(H.Button, { size: 'small', variant: 'primary' }, 'Open Preview') })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
