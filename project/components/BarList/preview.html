<!-- @dsCard group="Data" height=1336 subtitle="Default, links, extra columns with open, kept column at 480px and 360px, unit with mono labels, empty state" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BarList</title></head>
<body>
<div id="root" class="hy-col" style="max-width:560px"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
var projects = [
  { label: 'Marketing Site', value: 1280 },
  { label: 'Docs', value: 940 },
  { label: 'Dashboard', value: 615 },
  { label: 'A Very Long Project Name That Truncates', value: 302 },
  { label: 'Playground', value: 0 }
];
var services = [
  { label: 'api-gateway', value: 318 },
  { label: 'edge-cache', value: 204 },
  { label: 'build-runner', value: 1 }
];
function Open() {
  var s = React.useState('Nothing opened'), text = s[0], set = s[1];
  return h(F, null,
    h(H.BarList, { 'aria-label': 'Requests by service', labelHeader: 'Service', valueHeader: 'Requests', onOpen: function (it) { set(it.label); },
      columns: [{ key: 'p50', label: 'P50', priority: 3 }, { key: 'p99', label: 'P99', priority: 2 }, { key: 'errors', label: 'Errors', priority: 1 }],
      items: [
        { label: 'api-gateway', value: 5200, columns: { p50: '12 ms', p99: '240 ms', errors: '3' } },
        { label: 'edge-cache', value: 3100, columns: { p50: '9 ms', p99: '80 ms', errors: '0' } },
        { label: 'build-runner', value: 640, columns: { p50: '4 s', p99: '9 s' } }
      ] }),
    h('div', { className: 'copy-14', 'aria-live': 'polite' }, 'Opened: ' + text));
}
var indexerColumns = [{ key: 'hit', label: 'Hit', hideable: false }, { key: 'answer', label: 'Answer', priority: 2 }, { key: 'failed', label: 'Failed', priority: 1 }];
var indexers = [
  { label: 'indexer-alpha', value: 5200, columns: { hit: '94%', answer: '310 ms', failed: '12' } },
  { label: 'indexer-beta', value: 3100, columns: { hit: '81%', answer: '95 ms', failed: '0' } },
  { label: 'indexer-gamma', value: 640, columns: { hit: '60%' } }
];
function Indexers(p) {
  return h('div', { style: { width: p.width, maxWidth: '100%' } },
    h(H.BarList, { 'aria-label': 'Indexers at ' + p.width + ' pixels', labelHeader: 'Indexer', valueHeader: 'Requests', columns: indexerColumns, items: indexers }));
}
function Demo() {
  return h(F, null,
    h('div', { className: 'label-13' }, 'Top Projects'),
    h(H.BarList, { 'aria-label': 'Top projects by deployments', items: projects }),
    h('div', { className: 'label-13', style: { marginTop: 16 } }, 'Links'),
    h(H.BarList, { 'aria-label': 'Top routes', items: [
      { label: '/docs', value: 5200, href: '#docs' },
      { label: '/pricing', value: 3100, href: '#pricing' }
    ] }),
    h('div', { className: 'label-13', style: { marginTop: 16 } }, 'Columns And Open'),
    h(Open),
    h('div', { className: 'label-13', style: { marginTop: 16 } }, 'Kept Column At 480px'),
    h(Indexers, { width: 480 }),
    h('div', { className: 'label-13', style: { marginTop: 16 } }, 'Kept Column At 360px'),
    h(Indexers, { width: 360 }),
    h('div', { className: 'label-13', style: { marginTop: 16 } }, 'Unit And Mono'),
    h(H.BarList, { 'aria-label': 'Build minutes by service', items: services, unit: 'minutes', mono: true }),
    h('div', { className: 'label-13', style: { marginTop: 16 } }, 'Empty'),
    h(H.BarList, { 'aria-label': 'Top sources', items: [], empty: h('div', { className: 'copy-14' }, 'No Data Yet') }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
