<!-- @dsCard group="Navigation" height=1450 subtitle="Floating pill tab bar for phones: translucent blurred surface over scrolling posters, opaque, selected pill, dot, count and 99+, error and warning badges, accessory, a current More item, minimised" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TabBar</title></head>
<body>
<div id="root" class="hy-col" style="max-width:375px"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
/* The bar is fixed to the screen; the demos sit it in the flow so several fit on one card. */
var inFlow = { position: 'relative', inset: 'auto', padding: '0 0 8px' };
function icon(name) { return h(H.Icon, { name: name, size: 20 }); }
/* Busy, high-contrast poster tiles drawn from tokens, to test the bar's surface against. */
var posters = [
  'repeating-linear-gradient(45deg, var(--gray-1000) 0 6px, var(--background-100) 6px 12px)',
  'conic-gradient(from 90deg, var(--accent-900), var(--red-800), var(--amber-700), var(--gray-1000), var(--accent-900))',
  'linear-gradient(135deg, var(--gray-1000) 0 50%, var(--background-100) 50% 100%)',
  'repeating-conic-gradient(var(--gray-1000) 0 25%, var(--background-100) 0 50%) 0 0 / 16px 16px',
  'radial-gradient(circle at 30% 30%, var(--background-100) 0 18%, var(--gray-1000) 18% 36%, var(--accent-900) 36% 54%, var(--red-800) 54% 72%, var(--amber-700) 72%)',
  'linear-gradient(90deg, var(--black) 0 20%, var(--white) 20% 40%, var(--black) 40% 60%, var(--white) 60% 80%, var(--black) 80%)'
];
var rows = ['Deployed main to production', 'Preview ready for docs', 'Domain verified', 'Build failed on feat/tab-bar', 'Branch merged'];
function lines(list) { return list.map(function (t) { return h('p', { key: t, style: { margin: '0 0 12px' } }, t); }); }
/* The bar floats over a scrolling screen: posters scroll under it. The scroll area is padded by --tab-bar-height. */
function Screen(props) {
  var scroller = React.useRef(null);
  React.useLayoutEffect(function () { scroller.current.scrollTop = 50; }, []);
  return h('div', { style: { position: 'relative', height: 300, overflow: 'hidden', border: '1px solid var(--gray-alpha-400)', borderRadius: 16, background: 'var(--background-100)' } },
    h('div', { ref: scroller, tabIndex: 0, role: 'region', 'aria-label': props.name, className: 'copy-14',
      style: { height: '100%', overflowY: 'auto', padding: '8px 12px var(--tab-bar-height)', boxSizing: 'border-box' } },
      lines(rows.slice(0, 2)),
      h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8, margin: '0 0 12px' } },
        posters.map(function (bg, i) { return h('div', { key: i, 'aria-hidden': 'true', style: { height: 120, borderRadius: 8, background: bg } }); })),
      lines(rows.slice(2)),
      /* Flat black and white posters: the worst case for a see-through surface, since nothing blurs to a mid tone. */
      h('div', { 'aria-hidden': 'true', style: { height: 72, borderRadius: 8, background: 'var(--black)', margin: '0 0 12px' } }),
      h('div', { 'aria-hidden': 'true', style: { height: 72, borderRadius: 8, background: 'var(--white)', boxShadow: '0 0 0 1px var(--gray-alpha-400)', margin: '0 0 12px' } })),
    h(H.TabBar, { label: props.name, hideFrom: false, style: { position: 'absolute' }, defaultValue: 'library', opaque: props.opaque,
      accessory: { label: 'Search', icon: icon('search') } },
      h(H.TabBar.Item, { value: 'overview', label: 'Overview', icon: icon('inbox'), badge: 3, badgeLabel: '3 need attention' }),
      h(H.TabBar.Item, { value: 'library', label: 'Library', icon: icon('library'), badge: true, badgeLabel: 'New titles' }),
      h(H.TabBar.Item, { value: 'activity', label: 'Activity', icon: icon('activity') }),
      h(H.TabBar.Item, { label: 'More', icon: icon('ellipsis'), haspopup: true })));
}
function Demo() {
  var s = React.useState('overview'), screen = s[0], setScreen = s[1];
  var scroller = React.useRef(null);
  React.useEffect(function () { var t = setTimeout(function () { scroller.current.scrollTop = 60; }, 200); return function () { clearTimeout(t); }; }, []);
  return h(F, null,
    h('p', { className: 'label-13' }, 'Default: a translucent, blurred surface over scrolling content'),
    h(Screen, { name: 'Screens over content' }),
    h('p', { className: 'label-13' }, 'opaque: the solid surface'),
    h(Screen, { name: 'Screens, opaque', opaque: true }),
    h('p', { className: 'label-13' }, 'Selected, dot, count and 99+ badges, accessory'),
    h(H.TabBar, { label: 'Screens', hideFrom: false, style: inFlow, value: screen, onValueChange: setScreen,
      accessory: { label: 'Search', icon: icon('search') } },
      h(H.TabBar.Item, { value: 'overview', label: 'Overview', icon: icon('inbox'), badge: 3, badgeLabel: '3 need attention' }),
      h(H.TabBar.Item, { value: 'library', label: 'Library', icon: icon('library'), badge: true, badgeLabel: 'New titles' }),
      h(H.TabBar.Item, { value: 'upcoming', label: 'Upcoming', icon: icon('calendar-clock') }),
      h(H.TabBar.Item, { value: 'activity', label: 'Activity', icon: icon('activity'), badge: 120, badgeLabel: 'More than 99 events' }),
      h(H.TabBar.Item, { label: 'More', icon: icon('ellipsis'), haspopup: true })),
    h('p', { className: 'label-13' }, 'Error count and warning dot badges'),
    h(H.TabBar, { label: 'Screens', hideFrom: false, style: inFlow, defaultValue: 'overview' },
      h(H.TabBar.Item, { value: 'overview', label: 'Overview', icon: icon('inbox'), badge: 2, badgeTone: 'error', badgeLabel: '2 blocking' }),
      h(H.TabBar.Item, { value: 'library', label: 'Library', icon: icon('library'), badge: true, badgeTone: 'warning', badgeLabel: 'Needs review' }),
      h(H.TabBar.Item, { value: 'upcoming', label: 'Upcoming', icon: icon('calendar-clock'), badge: 3, badgeLabel: '3 scheduled' })),
    h('p', { className: 'label-13' }, 'More is current while a screen inside it is open'),
    h(H.TabBar, { label: 'Screens', hideFrom: false, style: inFlow },
      h(H.TabBar.Item, { value: 'overview', label: 'Overview', icon: icon('inbox') }),
      h(H.TabBar.Item, { value: 'library', label: 'Library', icon: icon('library') }),
      h(H.TabBar.Item, { value: 'upcoming', label: 'Upcoming', icon: icon('calendar-clock') }),
      h(H.TabBar.Item, { value: 'activity', label: 'Activity', icon: icon('activity') }),
      h(H.TabBar.Item, { label: 'More', icon: icon('ellipsis'), haspopup: true, current: true })),
    h('p', { className: 'label-13' }, 'Minimised after scrolling down (scroll up or tap it to expand)'),
    h('div', { ref: scroller, tabIndex: 0, role: 'region', 'aria-label': 'Activity feed', className: 'copy-14',
      style: { height: 72, overflowY: 'auto', border: '1px solid var(--gray-alpha-400)', borderRadius: 8, padding: 8, marginBottom: 8 } },
      ['Deployed main to production', 'Preview ready for docs', 'Domain verified', 'Build failed on feat/tab-bar', 'Branch merged', 'Preview ready for api'].map(function (t) {
        return h('p', { key: t, style: { margin: '0 0 24px' } }, t);
      })),
    h(H.TabBar, { label: 'Screens', hideFrom: false, style: inFlow, minimizeOnScroll: true, scrollRef: scroller, defaultValue: 'activity',
      accessory: { label: 'Search', icon: icon('search') } },
      h(H.TabBar.Item, { value: 'overview', label: 'Overview', icon: icon('inbox') }),
      h(H.TabBar.Item, { value: 'library', label: 'Library', icon: icon('library') }),
      h(H.TabBar.Item, { value: 'upcoming', label: 'Upcoming', icon: icon('calendar-clock') }),
      h(H.TabBar.Item, { value: 'activity', label: 'Activity', icon: icon('activity') }),
      h(H.TabBar.Item, { label: 'More', icon: icon('ellipsis'), haspopup: true })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
