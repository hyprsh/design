<!-- @dsCard group="Forms" height=200 subtitle="Checked, indeterminate parent, disabled with and without a check" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkbox</title></head>
<body>
<div id="root" class="hy-col"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
var ENVS = ['Production', 'Preview', 'Development'];
function Demo() {
  var s = React.useState({ Production: true, Preview: false, Development: true }), on = s[0], setOn = s[1];
  var count = ENVS.filter(function (e) { return on[e]; }).length;
  function setAll(v) { var n = {}; ENVS.forEach(function (e) { n[e] = v; }); setOn(n); }
  return h(F, null,
    h(H.Checkbox, { checked: count === ENVS.length, indeterminate: count > 0 && count < ENVS.length, onChange: function () { setAll(count < ENVS.length); } }, 'All Environments'),
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 4, paddingLeft: 24 } },
      ENVS.map(function (e) {
        return h(H.Checkbox, { key: e, checked: !!on[e], onChange: function () { var n = Object.assign({}, on); n[e] = !n[e]; setOn(n); } }, e);
      })),
    h('div', { className: 'hy-row', style: { padding: 0, gap: 24 } },
      h(H.Checkbox, { disabled: true }, 'Skew Protection'),
      h(H.Checkbox, { disabled: true, defaultChecked: true }, 'Build Cache')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
