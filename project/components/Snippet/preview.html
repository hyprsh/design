<!-- @dsCard group="Content" height=372 subtitle="Copyable command, multi-line, inverted, tinted and empty" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Snippet</title></head>
<body>
<div id="root" class="hy-col"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
function Demo() {
  return h(F, null,
    h(H.Snippet, { text: 'npm i -g hyprsh' }),
    h(H.Snippet, { text: ['hyprsh login', 'hyprsh deploy --prod'], width: '100%' }),
    h(H.Snippet, { text: 'hyprsh env pull .env.local', dark: true }),
    h(H.Snippet, { text: 'hyprsh promote', type: 'success' }),
    h(H.Snippet, { text: 'hyprsh remove my-app --yes', type: 'error' }),
    h(H.Snippet, { text: '', placeholder: 'Generate a token to see the command…', width: '100%' }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
