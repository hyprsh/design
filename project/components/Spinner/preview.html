<!-- @dsCard group="Feedback" height=170 subtitle="Sizes sm to 4xl; custom colour; with text; in a button" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Spinner</title></head>
<body>
<div id="root" class="hy-col" style="max-width:none"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
function Demo() {
  return h(F, null,
    h('div', { className: 'hy-row', style: { padding: 0, gap: 24, alignItems: 'center' } },
      ['sm', 'md', 'lg', 'xl', '2xl', '3xl', '4xl'].map(function (s) { return h(H.Spinner, { key: s, size: s }); })),
    h('div', { className: 'hy-row', style: { padding: 0, gap: 24, alignItems: 'center' } },
      h(H.Spinner, { size: 'lg', style: { color: 'var(--red-700)' }, label: 'Retrying' }),
      h('span', { className: 'copy-14', style: { color: 'var(--gray-900)', display: 'inline-flex', gap: 8, alignItems: 'center' } }, h(H.Spinner, null), 'Loading…'),
      h(H.Button, { size: 'small', loading: true }, 'Deploy')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
