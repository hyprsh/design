<!-- @dsCard group="Overlays" height=1580 subtitle="⌘ K palette: groups, shortcuts, arrow keys, empty state; async server search with loading and a key hook; an inline panel with native keys, Esc back via skipMenu, an input ref" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CommandMenu</title></head>
<body>
<div id="root" style="display:flex;flex-direction:column;gap:24px"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
function K(k) { return h(H.KeyboardInput, { small: true }, k); }
function Demo() {
  var s = React.useState(true), open = s[0], setOpen = s[1];
  return h(F, null,
    h(H.Button, { size: 'small', variant: 'secondary', onClick: function () { setOpen(true); }, suffix: h(H.KeyboardInput, { meta: true, small: true }, 'K') }, 'Search…'),
    h(H.CommandMenu, { open: open, setOpen: setOpen, inline: true },
      h(H.CommandMenuInput, { placeholder: 'Search for a command or page…' }),
      h(H.CommandMenuList, null,
        h(H.CommandMenuGroup, { heading: 'Projects' },
          h(H.CommandMenuItem, { callback: function () {} }, 'hyprsh-web'),
          h(H.CommandMenuItem, { callback: function () {} }, 'hyprsh-api')),
        h(H.CommandMenuGroup, { heading: 'Actions' },
          h(H.CommandMenuItem, { keywords: ['new'], suffix: h(F, null, K('⌘'), K('N')), callback: function () {} }, 'Create Project…'),
          h(H.CommandMenuItem, { keywords: ['ship', 'release'], callback: function () {} }, 'Deploy to Production'),
          h(H.CommandMenuItem, { keywords: ['dark', 'light'], suffix: h(F, null, K('⌘'), K('⇧'), K('L')), callback: function () {} }, 'Switch Theme')),
        h(H.CommandMenuDivider),
        h(H.CommandMenuGroup, { heading: 'Navigation' },
          h(H.CommandMenuItem, { suffix: h(F, null, K('G'), K('S')), callback: function () {} }, 'Go to Settings'),
          h(H.CommandMenuItem, { suffix: h(F, null, K('G'), K('U')), callback: function () {} }, 'Go to Usage')))));
}
var REMOTE = ['hyprsh-web', 'hyprsh-api', 'hyprsh-docs', 'hyprsh-edge', 'hyprsh-billing', 'hyprsh-worker'];
function fuzzy(name, q) { var i = 0; for (var j = 0; j < name.length && i < q.length; j++) if (name[j] === q[i]) i++; return i === q.length; }
function Async() {
  var sq = React.useState(''), query = sq[0], setQuery = sq[1];
  var sr = React.useState({ list: REMOTE.slice(0, 3), busy: false }), res = sr[0], setRes = sr[1];
  var sp = React.useState(null), picked = sp[0], setPicked = sp[1];
  React.useEffect(function () {
    var q = query.trim().toLowerCase();
    if (!q) { setRes({ list: REMOTE.slice(0, 3), busy: false }); return; }
    setRes(function (r) { return { list: r.list, busy: true }; });
    var t = setTimeout(function () { setRes({ list: REMOTE.filter(function (n) { return fuzzy(n, q); }), busy: false }); }, 700);
    return function () { clearTimeout(t); };
  }, [query]);
  return h(F, null,
    h('div', { className: 'copy-13', style: { color: 'var(--gray-900)' } }, 'Async: fake server search (700 ms), fuzzy matches such as “hpw” that the built-in filter would hide, Esc on a query clears it first.' + (picked ? ' Picked ' + picked + '.' : '')),
    h(H.CommandMenu, {
      open: true, setOpen: function () {}, inline: true, hotkey: false, label: 'Search Projects',
      query: query, onQueryChange: setQuery, shouldFilter: false,
      onKeyDown: function (e) { if (e.key === 'Escape' && query) { e.preventDefault(); setQuery(''); } }
    },
      h(H.CommandMenuInput, { placeholder: 'Search projects…', prefix: h(H.Badge, { size: 'sm' }, 'Projects'), hideClose: true }),
      h(H.CommandMenuList, { loading: res.busy },
        res.list.map(function (n) { return h(H.CommandMenuItem, { key: n, keepOpen: true, callback: function () { setPicked(n); } }, n); }))));
}
function Panel() {
  var sm = React.useState('list'), mode = sm[0], setMode = sm[1];
  var sr = React.useState('staging'), env = sr[0], setEnv = sr[1];
  var sd = React.useState(''), log = sd[0], setLog = sd[1];
  var inputRef = React.useRef(null);
  var first = React.useRef(true);
  /* Back on the list the input is a new element: put the caret back in it. */
  React.useEffect(function () {
    if (first.current) { first.current = false; return; }
    if (mode === 'list' && inputRef.current) inputRef.current.focus();
  }, [mode]);
  function note(t) { setLog(t); }
  return h(F, null,
    h('div', { className: 'copy-13', style: { color: 'var(--gray-900)' } }, 'Panel: “Deploy…” swaps the list for a button and radios. Enter and Space press the button and the arrows move between radios natively; Esc goes back through e.skipMenu() instead of closing, and focus returns to the input through inputRef. Ctrl+N / Ctrl+P move the highlight.' + (log ? ' ' + log : '')),
    h(H.CommandMenu, {
      open: true, setOpen: function () {}, inline: true, hotkey: false, label: 'Deploy Menu', inputRef: inputRef,
      onKeyDown: function (e) { if (e.key === 'Escape' && mode === 'panel') { e.skipMenu(); setMode('list'); note('Esc went back.'); } }
    },
      mode === 'list' ? h(F, null,
        h(H.CommandMenuInput, { placeholder: 'Search for a command…', hideClose: true }),
        h(H.CommandMenuList, null,
          h(H.CommandMenuGroup, { heading: 'Actions' },
            h(H.CommandMenuItem, { keepOpen: true, callback: function () { setMode('panel'); note(''); } }, 'Deploy…'),
            h(H.CommandMenuItem, { callback: function () {} }, 'Create Branch'),
            h(H.CommandMenuItem, { callback: function () {} }, 'Add Domain')))) :
      h('div', { className: 'hy-col', style: { padding: 16, gap: 12 }, 'data-panel': true },
        h('div', { className: 'label-14' }, 'Deploy to…'),
        h('div', { role: 'radiogroup', 'aria-label': 'Environment', style: { display: 'flex', gap: 16 } },
          ['staging', 'production', 'preview'].map(function (v) {
            return h('label', { key: v, className: 'copy-14', style: { display: 'flex', gap: 6, alignItems: 'center' } },
              h('input', { type: 'radio', name: 'env', value: v, checked: env === v, onChange: function () { setEnv(v); } }), v);
          })),
        h(H.Button, { size: 'small', variant: 'primary', onClick: function () { note('Deployed to ' + env + '.'); } }, 'Deploy'))));
}
/* A transformed box becomes the containing block of the fixed overlay, so each inline menu stays in its own frame. */
function Frame(height, child) { return h('div', { style: { position: 'relative', transform: 'translateZ(0)', height: height } }, child); }
function Both() { return h(F, null, Frame(620, h(Demo)), Frame(400, h(Async)), Frame(440, h(Panel))); }
ReactDOM.createRoot(document.getElementById('root')).render(h(Both));
</script>
</body>
</html>
