<!-- @dsCard group="Status" height=200 subtitle="8 hues solid and subtle, inverted; sm, md, lg; with icons" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Badge</title></head>
<body>
<div id="root" class="hy-col" style="max-width:none"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
function Demo() {
  var hues = ['gray', 'blue', 'purple', 'amber', 'red', 'pink', 'green', 'teal'];
  var cap = function (s) { return s[0].toUpperCase() + s.slice(1); };
  var shield = h(H.Icon, { name: 'shield' });
  var row = function (kids) { return h('div', { className: 'hy-row', style: { padding: 0, gap: 8 } }, kids); };
  return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } },
    row(hues.map(function (v) { return h(H.Badge, { key: v, variant: v }, cap(v)); }).concat([
      h(H.Badge, { key: 'i', variant: 'inverted' }, 'Inverted')])),
    row(hues.map(function (v) { return h(H.Badge, { key: v, variant: v, contrast: 'low' }, cap(v) + ' Subtle'); })),
    row([
      h(H.Badge, { key: 1, size: 'sm', variant: 'purple', contrast: 'low' }, 'Beta'),
      h(H.Badge, { key: 2, size: 'md', variant: 'blue', contrast: 'low' }, 'Preview'),
      h(H.Badge, { key: 3, size: 'lg', variant: 'green', contrast: 'low' }, 'Production')]),
    row([
      h(H.Badge, { key: 1, size: 'sm', icon: shield, variant: 'blue' }, 'Protected'),
      h(H.Badge, { key: 2, size: 'md', icon: shield, variant: 'blue' }, 'Protected'),
      h(H.Badge, { key: 3, size: 'lg', icon: shield, variant: 'blue' }, 'Protected'),
      h(H.Badge, { key: 4, size: 'sm', icon: shield, variant: 'gray', contrast: 'low' }, 'Protected'),
      h(H.Badge, { key: 5, size: 'md', icon: shield, variant: 'gray', contrast: 'low' }, 'Protected'),
      h(H.Badge, { key: 6, size: 'lg', icon: shield, variant: 'gray', contrast: 'low' }, 'Protected')]));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
