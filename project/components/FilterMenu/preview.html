<!-- @dsCard group="Forms" height=470 subtitle="Include, exclude and search; sections, none row, sort menu" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FilterMenu</title></head>
<body>
<div id="root" class="hy-row" style="max-width:none;align-items:flex-start;gap:24px"></div>
<script>
var H = window.Hyprsh, h = React.createElement, F = React.Fragment;
function dot(color) {
  return h('span', { style: { display: 'block', width: 10, height: 10, borderRadius: '50%', background: 'var(--' + color + '-700)' } });
}
var labels = [
  { value: 'bug', label: 'bug', description: 'Something isn’t working', prefix: dot('red'), suffix: 'Recent' },
  { value: 'docs', label: 'docs', description: 'Improvements to documentation', prefix: dot('blue') },
  { value: 'feature', label: 'feature', description: 'New functionality', prefix: dot('green') },
  { value: 'performance', label: 'performance', description: 'Slow builds or requests', prefix: dot('amber') },
  { value: 'security', label: 'security', description: 'Vulnerabilities and hardening', prefix: dot('purple') }
];
function Demo() {
  var value = React.useState({ include: ['bug'], exclude: ['docs'], none: false });
  var sort = React.useState('newest');
  return h(F, null,
    h(H.FilterMenu, {
      label: 'Labels', noneLabel: 'No labels', excludable: true, defaultOpen: true, value: value[0], onChange: value[1]
    },
      h(H.FilterMenu.Section, { title: 'Suggestions' },
        h(H.FilterMenu.Item, labels[0]), h(H.FilterMenu.Item, labels[1])),
      h(H.FilterMenu.Section, { title: 'All Labels' }, labels.map(function (l) { return h(H.FilterMenu.Item, Object.assign({ key: l.value }, l)); }))),
    h(H.FilterMenu, {
      label: 'Sort', single: true, defaultOption: 'newest', value: sort[0], onChange: sort[1],
      items: [{ value: 'newest', label: 'Newest' }, { value: 'oldest', label: 'Oldest' }, { value: 'comments', label: 'Most Commented' }]
    }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
